<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .banner {
            height: 270px;
            background: #ccc;
            color: #999;
            font-size: 70px;
        }

        .product-img {
            height: 170px;
            background: #ccc;
            color: #999;
        }

        .sale {
            position: absolute;
            top: 12px;
            right: -32px;
            background: orange;
            color: white;
            padding: 3px 35px;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light border py-1">
    <div class="container" style="max-width: 760px;">
        <a class="navbar-brand small" href="#">Navbar</a>

        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link small active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link small" href="#">Link</a></li>
            <li class="nav-item"><a class="nav-link small" href="#">Dropdown</a></li>
        </ul>

        <form class="d-flex">
            <input class="form-control form-control-sm me-2" placeholder="Search">
            <button class="btn btn-outline-primary btn-sm">Search</button>
        </form>
    </div>
</nav>

<div class="banner d-flex justify-content-center align-items-center position-relative">
    <span class="position-absolute start-0 ms-5 text-white fs-2">&lsaquo;</span>
    1920 x 530
    <span class="position-absolute end-0 me-5 text-white fs-2">&rsaquo;</span>
</div>

<div class="container py-4" style="max-width: 760px;">

    <div class="row g-3">

                    <p class="mb-1">Product</p>
                    <del class="small">100.000đ</del>
                    <span class="small text-warning">80.000 vnđ</span><br>
                    <button class="btn btn-primary btn-sm">🛒</button>
                    <button class="btn btn-outline-secondary btn-sm">Xem chi tiết</button>
                </div>
            </div>
        </div>

        <div class="col-3">
            <div class="card rounded-0">
                <div class="product-img d-flex justify-content-center align-items-center">280 x 280</div>
                <div class="card-body p-2">
                    <p class="mb-1">Product</p>
                    <del class="small">100.000đ</del>
                    <span class="small text-warning">80.000 vnđ</span><br>
                    <button class="btn btn-primary btn-sm">🛒</button>
                    <button class="btn btn-outline-secondary btn-sm">Xem chi tiết</button>

        </div>

                <div class="card-body p-2">
                    <p class="mb-1">Product</p>
                    <del class="small">100.000đ</del>
                    <span class="small text-warning">80.000 vnđ</span><br>
                    <button class="btn btn-primary btn-sm">🛒</button>
                    <button class="btn btn-outline-secondary btn-sm">Xem chi tiết</button>

        </div>

</html>
