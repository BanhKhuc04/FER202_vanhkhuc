<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid</title>

    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="bg-secondary-subtle p-5 mb-4">
        <h1 class="fw-bold">Let's test the grid!</h1>
    </div>

    <div class="container" style="max-width: 1100px;">
        <div class="row">
            <div class="col-6 bg-secondary-subtle border border-secondary p-2" style="height: 70px;">First col</div>
            <div class="col-6 bg-secondary-subtle border border-secondary p-2" style="height: 70px;">Second col</div>
        </div>

        <div class="row">
            <div class="col-4 bg-secondary-subtle border border-secondary p-2" style="height: 70px;">col</div>
            <div class="col-4 bg-secondary-subtle border border-secondary p-2" style="height: 70px;">col</div>
            <div class="col-4 bg-secondary-subtle border border-secondary p-2" style="height: 70px;">col</div>
        </div>

        <div class="row">
            <div class="col-3 bg-secondary-subtle border border-secondary p-2" style="height: 70px;">col</div>
            <div class="col-3 bg-secondary-subtle border border-secondary p-2" style="height: 70px;">col</div>
            <div class="col-3 bg-secondary-subtle border border-secondary p-2" style="height: 70px;">col</div>
            <div class="col-3 bg-secondary-subtle border border-secondary p-2" style="height: 70px;">col</div>
        </div>
    </div>

    <div class="bg-danger-subtle text-center fw-bold fs-1 mt-4">
        Created by ABC!
    </div>

    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
