<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cards Columns</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h2>Cards Columns</h2>

<div class="row g-4">
    <div class="col-4">
        <div class="card bg-primary p-3">
            <img src="./img/1.png" class="card-img-top" alt="Car">
            <p class="text-center mb-0">Some text inside the first card</p>
        </div>
    </div>

    <div class="col-4">
        <div class="card bg-warning p-3">
            <img src="./img/1.png" class="card-img-top" alt="Car">
            <p class="text-center mb-0">Some text inside the first card</p>
        </div>
    </div>

    <div class="col-4">
        <div class="card bg-danger p-3">
            <img src="./img/1.png" class="card-img-top" alt="Car">
            <p class="text-center mb-0">Some text inside the first card</p>
        </div>
    </div>
</div>

</body>
</html>
