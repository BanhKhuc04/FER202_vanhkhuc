<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form đặt vé máy bay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-3" style="max-width: 520px;">
    <div class="alert alert-warning py-2 text-end">
        <button type="button" class="btn-close"></button>
    </div>

    <h1 class="fw-bold mb-3">Form đặt vé máy bay</h1>

    <form>
        <div class="mb-3">
            <label class="form-label">Họ tên</label>

            <div class="input-group">
                <span class="input-group-text">♙</span>
                <input type="text" class="form-control" placeholder="Họ tên">
                <span class="input-group-text">vnd</span>
            </div>

            <div class="form-text">Phải nhập 5 ký tự, in hoa....</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Địa chỉ</label>
            <input type="text" class="form-control">
            <div class="form-text">Phải nhập 5 ký tự, in hoa....</div>
        </div>

        <div class="row mb-3">
            <div class="col-6">
                <label class="form-label">Đi từ</label>
                <select class="form-select">
                    <option>Hà nội</option>
                    <option>Đà Nẵng</option>
                    <option>Hồ Chí Minh</option>
                </select>
            </div>

            <div class="col-6">
                <label class="form-label">Đến</label>
                <select class="form-select">
                    <option>Hà nội</option>
                    <option>Đà Nẵng</option>
                    <option>Hồ Chí Minh</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Chọn chiều đi (Khứ hồi)</label>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="di">
                <label class="form-check-label" for="di">Đi</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="ve">
                <label class="form-check-label" for="ve">Về</label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Đặt vé
        </button>
    </form>
</div>

</body>
</html>
